<c8y-title>{{ 'Service requests' | translate }}</c8y-title>

<c8y-action-bar-item [placement]="'left'">
  <label
    class="c8y-switch c8y-switch--inline"
    title="{{ 'Show resolved alarms and closed service requests' | translate }}"
    aria-label="{{ 'Show resolved' | translate }}"
  >
    <input
      type="checkbox"
      [checked]="showResolved"
      (change)="onShowResolvedToggle($any($event.target).checked)"
    />
    <span></span> {{ 'Show resolved' | translate }}
  </label>
</c8y-action-bar-item>

<c8y-action-bar-item [placement]="'right'">
  <div class="d-flex a-i-center">
    <div class="sr-mo-chips" *ngIf="serviceObjectId()">
      <span class="sr-mo-chip" [title]="'Managed object fragment: sr_ServiceObjectId' | translate">
        <span class="sr-mo-chip-label">{{ 'Service Object' | translate }}</span>
        <code>{{ serviceObjectId() }}</code>
      </span>
    </div>
    <button
      type="button"
      class="btn btn-link"
      [title]="'New service request' | translate"
      (click)="openNewRequestForDevice()"
    >
      <i c8yIcon="plus-circle"></i>
      {{ 'New service request' | translate }}
    </button>
  </div>
</c8y-action-bar-item>

<c8y-sv [isResizable]="true" [resizableConfig]="{ trackId: 'service-request-timeline', leftColumnWidth: '50%' }">
  <c8y-sv-list
    [title]="'Timeline' | translate"
    [showEmptyState]="!loading && !rows.length"
    [emptyStateIcon]="'c8y-data-explorer'"
    [emptyStateTitle]="'No alarms or service requests to display' | translate"
    [emptyStateSubtitle]="'Nothing relevant right now — try \'Show resolved\' to see everything' | translate"
  >
    <c8y-sv-header-actions>
      <c8y-alarms-interval-refresh
        [isIntervalToggleEnabled]="autoRefreshToggleEnabled"
        [alarmsListLoading$]="autoRefreshLoading$"
        (onCountdownEnded)="onAutoRefreshTick()"
      ></c8y-alarms-interval-refresh>
    </c8y-sv-header-actions>

    <sr-timeline-list
      [rows]="rows"
      [loading]="loading"
      (createFromAlarm)="openNewRequestFromAlarm($event)"
      (linkExistingFromAlarm)="linkExistingFromAlarm($event)"
    ></sr-timeline-list>

    <c8y-sv-footer *ngIf="hasMoreAlarms() || hasMoreServiceRequests()">
      <button
        type="button"
        class="btn btn-link"
        *ngIf="hasMoreAlarms()"
        [disabled]="loadingMore"
        (click)="loadNextAlarmPage()"
      >
        {{ 'Load more alarms' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-link"
        *ngIf="hasMoreServiceRequests()"
        [disabled]="loadingMoreSr"
        (click)="loadNextSrPage()"
      >
        {{ 'Load more service requests' | translate }}
      </button>
    </c8y-sv-footer>
  </c8y-sv-list>

  <c8y-sv-details
    emptyStateIcon="c8y-c8y-support"
    [emptyStateTitle]="'Nothing selected' | translate"
    [emptyStateSubtitle]="'Select an alarm or service request from the timeline to see its details' | translate"
  >
    <ng-container *ngIf="selectedAlarm as alarm">
      <sr-alarm-detail-panel
        #alarmPanel
        [alarm]="alarm"
        [linkedSr]="currentLinkedSr"
        (openSr)="selectSr($event)"
        (createRequest)="openNewRequestFromAlarm($event)"
        (linkExisting)="linkExistingFromAlarm($event)"
        (alarmChanged)="refreshAll()"
      ></sr-alarm-detail-panel>
      <c8y-sv-details-actions [actions]="alarmPanel.actions"></c8y-sv-details-actions>
    </ng-container>
    <ng-container *ngIf="selectedSr as sr">
      <sr-detail-panel
        #srPanel
        [sr]="sr"
        [linkedAlarms]="currentLinkedAlarms"
        (openAlarm)="selectAlarm($event)"
      ></sr-detail-panel>
      <c8y-sv-details-actions [actions]="srPanel.actions"></c8y-sv-details-actions>
    </ng-container>
    <ng-container *ngIf="selectedNewContext as newContext">
      <sr-new-request-form
        #newPanel
        [context]="newContext"
        [candidateAlarms]="alarms"
        (created)="selectSr($event)"
        (cancelled)="clearSelection()"
      ></sr-new-request-form>
      <c8y-sv-details-actions [actions]="newPanel.actions"></c8y-sv-details-actions>
    </ng-container>
  </c8y-sv-details>
</c8y-sv>
