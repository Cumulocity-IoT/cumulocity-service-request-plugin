<div class="sr-comments-list" *ngIf="!loadingComments; else loadingData">
  <div class="c8y-empty-state c8y-empty-state--horizontal" *ngIf="!comments.length">
    <i class="c8y-icon-duocolor c8y-icon c8y-icon-data-explorer"></i>
    <strong>{{ 'service-request-comments.no-comments' | translate }}</strong>
  </div>

  <c8y-list-group *ngIf="comments.length" role="list">
    <c8y-li-timeline *ngFor="let c of comments">
      {{ c.creationTime | c8yDate: 'medium' }}
      <c8y-li role="listitem">
        <div class="sr-comment-text" [class.sr-comment-text--system]="c.type === 'system'">
          <b>{{ c.owner }}</b> &mdash; <span [innerHtml]="c.text | nl2br"></span>
          <button
            type="button"
            class="btn btn-link p-0 m-l-8 sr-comment-attachment"
            (click)="downloadAttachment(c)"
            *ngIf="c.attachment"
          >
            <i c8yIcon="attach"></i>{{ c.attachment.name }}
          </button>
        </div>
      </c8y-li>
    </c8y-li-timeline>
  </c8y-list-group>

  <p class="sr-comments-more" *ngIf="additionalCommentsCount">
    + {{ additionalCommentsCount }} {{ 'service-request-comments.more' | translate }}
  </p>
</div>

<ng-template #loadingData>
  <div class="loading-data">
    <c8y-loading></c8y-loading>
  </div>
</ng-template>

<div class="sr-comment-compose" *ngIf="isCreateForm">
  <form novalidate name="form" [formGroup]="form" (ngSubmit)="submitComment()">
    <textarea
      id="c_text"
      class="form-control"
      name="text"
      rows="2"
      [placeholder]="'Add a comment...' | translate"
      [formControlName]="'text'"
    ></textarea>

    <div class="sr-comment-compose-actions">
      <c8y-file-picker #picker (onFilesPicked)="onFiles($event)" uploadChoice="uploadBinary"></c8y-file-picker>

      <button
        type="submit"
        class="btn btn-primary btn-sm"
        [class.btn-pending]="formInAction"
        [disabled]="form.pristine || formInAction"
      >
        {{ 'Post' | translate }}
      </button>
    </div>
  </form>
</div>
